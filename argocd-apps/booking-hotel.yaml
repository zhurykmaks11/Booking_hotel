# Application застосунку. Назва Application = назва Helm-релізу -> об'єкти booking-hotel-api, -postgres, -redis
# (як у Лаб. №4 при helm install booking-hotel).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking-hotel
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zhurykmaks11/Booking_hotel.git
    targetRevision: main
    path: helm/booking-hotel
    helm:
      valueFiles:
        - values-minikube.yaml   # шлях відносно каталогу чарта (path)
  destination:
    server: https://kubernetes.default.svc
    # Окремий namespace: реліз Лаб. №4 (helm install у booking-hotel) лишається недоторканим,
    # і в кожного namespace одне джерело правди — Helm або Argo CD
    namespace: booking-hotel-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true     # п. 6a: Argo CD повертає ручні зміни в кластері до стану з Git
    syncOptions:
      - CreateNamespace=true
