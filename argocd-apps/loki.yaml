# Loki (DevOps, Лаб. №7): сховище логів. Один процес (SingleBinary) і файлове сховище — без кешів,
# canary і тестових компонентів. Чарт з березня 2026 підтримує спільнота (grafana-community).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.6.4          # helm search repo grafana-community/loki (Loki 3.7)
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          storage: { type: filesystem }
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
        singleBinary: { replicas: 1 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        # minio: { enabled: false } з інструкції не потрібен: у чарті 21.x MinIO прибрано, а схема values
        # відхиляє невідомий ключ (additional properties 'minio' not allowed)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
