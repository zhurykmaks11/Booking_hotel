services:
  db:
    image: postgres:16
    container_name: hotel_booking_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hotel_booking_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Розподілений кеш (Лаб. №4): один Redis, спільний для всіх інстансів API.
  # Навмисно НЕ в depends_on у API: сервіс має стартувати і працювати без Redis (graceful degradation).
  redis:
    image: redis:7-alpine
    container_name: hotel_booking_redis
    restart: always
    # maxmemory + allkeys-lru: при заповненні пам'яті витісняються ключі, до яких найдовше не зверталися
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - hotel_booking_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    build: .
    container_name: hotel_booking_api_1
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/hotel_booking?schema=public"
      SYNTHETIC_DELAY_MS: "0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_booking_net

  api-2:
    build: .
    container_name: hotel_booking_api_2
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/hotel_booking?schema=public"
      SYNTHETIC_DELAY_MS: "0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_booking_net

  api-3:
    build: .
    container_name: hotel_booking_api_3
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/hotel_booking?schema=public"
      SYNTHETIC_DELAY_MS: "0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_booking_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: booking-hotel-nginx
    container_name: hotel_booking_nginx
    restart: always
    ports:
      - "80:80"
    # Конфіг вшитий в образ; volume лишається для live-перемикання алгоритмів (scripts/benchmark.js switch)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - hotel_booking_net

networks:
  hotel_booking_net:
    driver: bridge

volumes:
  pgdata: