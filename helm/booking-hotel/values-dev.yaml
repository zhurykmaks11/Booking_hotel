# Середовище РОЗРОБКИ: 1 репліка, мінімальні ресурси, найновіша версія, без Ingress.
api:
  replicaCount: 1
  image:
    tag: "1.1.0"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

config:
  nodeEnv: development

ingress:
  enabled: false
