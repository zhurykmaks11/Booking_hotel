# Середовище minikube під керуванням Argo CD (DevOps, Лаб. №5–7).
# Цей файл — "джерело правди": зміна тега / реплік / FAIL_RATE тут + git push = зміна в кластері.
api:
  # Лаб. №7: 5 реплік — canary 20 % = рівно 1 под нової версії (Лаб. №6: було 4)
  replicaCount: 5
  image:
    repository: ghcr.io/zhurykmaks11/booking-hotel-api
    # 1.5.0 — перша версія з /metrics, JSON-логами і FAIL_RATE (Лаб. №7)
    tag: "1.5.0"
    pullPolicy: IfNotPresent
  # Лаб. №7: «погана версія» для демонстрації автоматичного відкату — FAIL_RATE: "0.5" + коміт.
  # Змінна в шаблоні пода, тож її зміна запускає новий реліз (canary + аналіз), як і зміна тега.
  env:
    - name: FAIL_RATE
      value: "0"
  rollout:
    enabled: true
    # Лаб. №7: рішення promote / abort приймає аналіз метрик (AnalysisTemplate booking-hotel-api-success-rate),
    # а не людина — ручну паузу з Лаб. №6 прибрано
    analysis:
      enabled: true
      prometheusAddress: http://kps-prometheus.monitoring:9090
    strategy:
      canary:
        steps:
          - setWeight: 20                   # 1 под нової версії : 4 stable
          - pause: { duration: 30s }        # дати метрикам накопичитися (scrape 15 с, rate за 1 хв)
          - analysis:
              templates:
                - templateName: booking-hotel-api-success-rate
          - setWeight: 60                   # 3 : 2
          - pause: { duration: 30s }
          # далі 100 %: canary стає stable

# Лаб. №7: ServiceMonitor, дашборд Grafana (ConfigMap) і алерт на частку 5xx
metrics:
  enabled: true
  alerts:
    enabled: true

config:
  nodeEnv: production
  logFormat: json

ingress:
  enabled: false

# Secret з паролем БД створюється вручну (не з Git), Argo CD його не видаляє навіть з prune:
#   kubectl -n booking-hotel-gitops create secret generic booking-hotel-db-secret \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=DATABASE_URL=postgresql://postgres:...@booking-hotel-postgres:5432/hotel_booking?schema=public
existingSecret: booking-hotel-db-secret

# Argo CD виконує Helm-хуки pre-install/pre-upgrade як PreSync — тобто ПЕРЕД створенням ресурсів,
# зокрема й при першій синхронізації, коли Postgres ще немає. Перевірка БД тоді завжди падала б.
hooks:
  preUpgradeDbCheck:
    enabled: false
# helm test Argo CD не запускає — під тесту не потрібен.
tests:
  enabled: false
