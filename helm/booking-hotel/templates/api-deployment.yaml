{{- if not .Values.api.rollout.enabled }}
# Звичайний Deployment (RollingUpdate). При api.rollout.enabled: true замість нього рендериться api-rollout.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booking-hotel.componentName" (dict "ctx" $ "component" "api") }}
  labels:
    {{- include "booking-hotel.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "booking-hotel.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  # Оновлення без простою: новий под має стати Ready, перш ніж буде зупинено старий
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.api.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.api.rollingUpdate.maxUnavailable }}
  template:
    {{- include "booking-hotel.apiPodTemplate" . | nindent 4 }}
{{- end }}
