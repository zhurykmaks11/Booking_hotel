apiVersion: v1
kind: Service
metadata:
  name: {{ include "booking-hotel.componentName" (dict "ctx" $ "component" "api") }}
  labels:
    {{- include "booking-hotel.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "booking-hotel.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
