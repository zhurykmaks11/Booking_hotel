apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booking-hotel.fullname" . }}-config
  labels:
    {{- include "booking-hotel.labels" (dict "ctx" $ "component" "config") | nindent 4 }}
data:
  # --- API ---
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  SYNTHETIC_DELAY_MS: {{ .Values.config.syntheticDelayMs | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "booking-hotel.componentName" (dict "ctx" $ "component" "redis")) | quote }}
  {{- end }}
  # --- PostgreSQL ---
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
