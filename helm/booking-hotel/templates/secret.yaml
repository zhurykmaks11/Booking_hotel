# Значення беруться з values (secrets.*), у шаблоні паролів немає.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking-hotel.fullname" . }}-secret
  labels:
    {{- include "booking-hotel.labels" (dict "ctx" $ "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword обов'язковий" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ include "booking-hotel.databaseUrl" . | quote }}
