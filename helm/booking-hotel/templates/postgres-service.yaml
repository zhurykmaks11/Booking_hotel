apiVersion: v1
kind: Service
metadata:
  name: {{ include "booking-hotel.componentName" (dict "ctx" $ "component" "postgres") }}
  labels:
    {{- include "booking-hotel.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "booking-hotel.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
