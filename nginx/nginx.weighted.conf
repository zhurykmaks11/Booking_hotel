events {
    worker_connections 1024;
}

http {
    # Алгоритм Weighted Round Robin: розподіл з урахуванням ваги (потужності) сервера
    # api-1 оброблятиме 60% запитів (вага 3), api-2 та api-3 — по 20% (вага 1)
    upstream backend_cluster {
        server api-1:3000 weight=3 max_fails=2 fail_timeout=5s;
        server api-2:3000 weight=1 max_fails=2 fail_timeout=5s;
        server api-3:3000 weight=1 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
