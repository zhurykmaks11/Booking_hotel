# Чутливі параметри. Навчальні значення — НЕ паролі від реальних систем.
# stringData: Kubernetes сам закодує значення в base64 при збереженні.
apiVersion: v1
kind: Secret
metadata:
  name: booking-secret
  namespace: booking-hotel
  labels:
    app.kubernetes.io/part-of: booking-hotel
type: Opaque
stringData:
  POSTGRES_PASSWORD: "lab3-k8s-demo-pass"
  # Рядок підключення API до БД (хост postgres = Service у цьому namespace)
  DATABASE_URL: "postgresql://postgres:lab3-k8s-demo-pass@postgres:5432/hotel_booking?schema=public"
