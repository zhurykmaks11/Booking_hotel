# Внутрішня адреса БД: postgres:5432 (доступна лише всередині кластера).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: booking-hotel
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: booking-hotel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
