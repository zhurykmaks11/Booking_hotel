# Внутрішня адреса кешу: redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: booking-hotel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: booking-hotel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
